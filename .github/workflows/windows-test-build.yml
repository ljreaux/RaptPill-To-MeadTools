name: Windows Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - "windows-test-build"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows executable
        shell: cmd
        run: |
          pyinstaller --onefile --windowed ^
            --name meadtools-pill ^
            --icon=src\icons\meadtools-pill.ico ^
            --add-data "src\icons;icons" ^
            --add-data "src\stylesheet;stylesheet" ^
            --add-data "src\data.json;." ^
            --hidden-import=PySide6.QtCore ^
            --hidden-import=PySide6.QtGui ^
            --hidden-import=PySide6.QtWidgets ^
            --hidden-import=requests ^
            --hidden-import=bleak ^
            --hidden-import=bleak.backends.winrt ^
            src\PillToMeadTools.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: meadtools-pill-windows
          path: dist/meadtools-pill.exe
          if-no-files-found: error
